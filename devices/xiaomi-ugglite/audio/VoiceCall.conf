# Voice call route for ugglite (MSM8917, PM8937 codec, qdsp6 q6voice).
#
# The modem <-> DSP stream is the hostless VoiceMMode1 front end: q6voiced
# opens hw:0,6 (or ztcallring's q6voice-hold does when q6voiced is absent).
# This verb only describes the routing around it:
#   downlink  VoiceMMode1 -> PRI_MI2S_RX -> RX1 -> EAR_S (earpiece)
#   uplink    AMIC -> CIC1 -> DEC1/ADC1 -> TERT_MI2S_TX -> VoiceMMode1
# The only gain written is the accepted microphone contract, ADC1 Volume 6
# (same value HiFi.conf writes).  RX1/RX2 Digital Volume stay 120 and are not
# touched here; this verb must not undo them.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' on"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' on"
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC1 Volume' 6"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RDAC2 MUX' RX1"
		cset "name='EAR_S' Switch"
		cset "name='Speaker Switch' off"
	]
	DisableSequence [
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='EAR_S' ZERO"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' off"
		cset "name='VoiceMMode1 Capture Mixer TERT_MI2S_TX' off"
	]
	Value {
		TQ "Voice Call"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (voice call)"
	Value {
		PlaybackPCM "hw:${CardId},6"
		PlaybackChannels 1
		PlaybackPriority 200
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone (voice call)"
	Value {
		CapturePCM "hw:${CardId},6"
		CaptureChannels 1
		CapturePriority 200
	}
}
