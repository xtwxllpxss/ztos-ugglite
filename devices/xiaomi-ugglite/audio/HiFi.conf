# Minimal UCM for Xiaomi Redmi Note 5A (ugglite), MSM8917 / qdsp6
# Playback path: MultiMedia1 -> PRI_MI2S_RX -> Speaker/Headphones
#
# Gain contract (C2): the fixed codec path gain (RX1/RX2 Digital Volume) is
# set once per verb, NOT in the per-device EnableSequence.  The PCM lifetime
# patch enables/disables the SectionDevice on every stream open/close, so a
# cset here would rewrite the analog gain on every idle cycle and silently
# undo whatever the user set.  Everything in the device sequences below is
# routing/power only.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' on"
		# path gain: fixed, written once when the verb is activated
		cset "name='RX1 Digital Volume' 120"
		cset "name='RX2 Digital Volume' 120"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' off"
		cset "name='DEC1 MUX' ZERO"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	# Speaker path on ugglite: HPHL/HPHR feed the board's external speaker amp
	# (DAPM "Speaker Amp INL/INR" <- HPHL/HPHR). While the codec mux is ZERO the
	# whole analog section (HPHL DAC/PA, CP, RX_BIAS) stays powered down and
	# playback is silent even though the PCM runs. So Switch is required here.
	Comment "Speaker playback"
	ConflictingDevice [ "Headphones" ]
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
	]
	Value {
		PlaybackPriority 300
		PlaybackChannels 1
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='Speaker Switch' off"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
	]
	DisableSequence [
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
	]
	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"
	Value {
		CapturePriority 100
		CaptureChannels 1
		CapturePCM "hw:${CardId},1"
	}
}
