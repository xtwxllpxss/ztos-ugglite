# Modules the ugglite layer wants loaded, by the names the pinned kernel package
# gives them. Every name is either in device-qcom-msm89x7/modules-initfs
# (pmaports 39fe8995) or derived from a =m symbol in
# config-postmarketos-qcom-msm89x7.aarch64 (7.1.3-r1); nothing here is a guess at
# a module filename.

# Display: the three panel drivers the ugglite device package ships as modules
# (DRM_PANEL_XIAOMI_UGGLITE_ILI9881C_SC, _OTM1901A_HX, _OTM1901A_TM = m).
# Loading all three is harmless: the panel in use is the one lk2nd puts on the
# kernel command line, and the others simply find no device. A hardware
# observation from Android on this phone (fb0 msm_fb_panel_info) reports
# "tm otm1901a 720p video mode dsi panel", which suggests the _TM one; that has
# not been confirmed under mainline or after lk2nd's selection.
panel_xiaomi_ugglite_otm1901a_tm
panel_xiaomi_ugglite_otm1901a_hx
panel_xiaomi_ugglite_ili9881c_sc
# DRM MSM (CONFIG_DRM_MSM=m) itself; also listed in modules-initfs.
msm

# Touch. CONFIG_TOUCHSCREEN_GOODIX=m and "goodix_ts" in modules-initfs; Android
# reports an input device named goodix-ts on this phone. Which controller lk2nd
# or the DT finally binds is still lk2nd's decision.
goodix_ts

# USB gadget: the GSI's zboot-usb-gadget (rootfs/overlay/usr/local/sbin) builds
# an NCM + ACM composite in configfs. The kernel has CONFIG_USB_GADGET=y but
# CONFIG_USB_CONFIGFS, CONFIG_USB_LIBCOMPOSITE, CONFIG_USB_F_NCM and
# CONFIG_USB_F_ACM as =m, so these must be loaded before the gadget directory
# can be created. Same set postmarketOS' initramfs loads for its USB network
# (main/postmarketos-initramfs/init_functions.sh modprobe libcomposite;
# device-pocketbook-614-plus/modules-initfs: usb_f_ncm, u_ether, libcomposite).
libcomposite
usb_f_ncm
usb_f_acm
u_ether
